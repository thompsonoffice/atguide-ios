# XcodeGen spec for the ATGuide iPhone app. The CI workflow runs `xcodegen generate`;
# locally: brew install xcodegen && xcodegen generate
name: ATGuide
options:
  bundleIdPrefix: com.thompsonoffice
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ATGuide:
    type: application
    platform: iOS
    sources:
      - path: ATGuide
    settings:
      base:
        PRODUCT_NAME: ATGuide
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.atguide
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ATGuide
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  ATGuideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ATGuideTests
    dependencies:
      - target: ATGuide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.atguide.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ATGuide.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ATGuide"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ATGuideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ATGuideUITests
    dependencies:
      - target: ATGuide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.atguide.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ATGuide
  ATGuideMac:
    type: application
    platform: macOS
    sources:
      - path: ATGuide/Model
      - path: ATGuide/App/UserState.swift
      - path: ATGuide/App/TextFileExport.swift
      - path: ATGuide/Resources
      - path: ATGuide/PrivacyInfo.xcprivacy
      - path: ATGuide/Assets.xcassets
      - path: ATGuideMac
    settings:
      base:
        PRODUCT_NAME: ATGuide
        PRODUCT_MODULE_NAME: ATGuideMac
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.atguide
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ATGuide
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Hunter Thompson"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ATGuideMac/ATGuide.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  ATGuideMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ATGuideTests
    dependencies:
      - target: ATGuideMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.atguide.mactests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ATGuide.app/Contents/MacOS/ATGuide"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ATGuideMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ATGuideMacUITests
    dependencies:
      - target: ATGuideMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.atguide.macuitests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_TARGET_NAME: ATGuideMac

schemes:
  ATGuide:
    build:
      targets:
        ATGuide: all
        ATGuideTests: [test]
        ATGuideUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ATGuideTests
        - ATGuideUITests
    archive:
      config: Release
  ATGuideMac:
    build:
      targets:
        ATGuideMac: all
        ATGuideMacTests: [test]
        ATGuideMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ATGuideMacTests
        - ATGuideMacUITests
    archive:
      config: Release
