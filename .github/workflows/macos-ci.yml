# Builds the Mac ATGuide target and runs unit tests. No signing, no upload.
name: macOS build and test

on:
  push:
    branches: [main]
    paths:
      - ATGuideMac/**
      - ATGuide/Model/**
      - ATGuide/App/**
      - ATGuide/Resources/**
      - ATGuideTests/**
      - ATGuideMacUITests/**
      - project.yml
      - .github/workflows/macos-ci.yml
  pull_request:
    paths:
      - ATGuideMac/**
      - ATGuide/Model/**
      - ATGuide/App/**
      - ATGuide/Resources/**
      - ATGuideTests/**
      - ATGuideMacUITests/**
      - project.yml
      - .github/workflows/macos-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Use the newest installed Xcode
        run: |
          XCODE=$(python3 scripts/select_xcode.py)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project ATGuide.xcodeproj \
            -scheme ATGuideMac \
            -destination "platform=macOS,arch=arm64" \
            -only-testing:ATGuideMacTests \
            -resultBundlePath build/ATGuideMac.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee build/xcodebuild-mac.log | xcbeautify --renderer github-actions

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATGuideMac-test-results
          path: |
            build/ATGuideMac.xcresult
            build/xcodebuild-mac.log
          if-no-files-found: warn
