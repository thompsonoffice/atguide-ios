# Builds ATGuide for the iOS Simulator and runs the unit tests, UI tests and accessibility audits.
# No signing, no upload. Runs on GitHub-hosted macOS (private repos use the account's included
# Actions minutes; macOS minutes count 10x).
name: iOS build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Use the newest installed Xcode
        run: |
          XCODE=$(python3 scripts/select_xcode.py)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -o pipefail
          if ! UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_simulator.py); then
            echo "No iPhone simulator yet; creating one on the newest iOS runtime"
            python3 scripts/create_simulator.py
            UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_simulator.py)
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build and run tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project ATGuide.xcodeproj \
            -scheme ATGuide \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/ATGuide.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee build/xcodebuild.log | xcbeautify --renderer github-actions

      - name: Test summary
        if: always()
        run: |
          if [ -d build/ATGuide.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/ATGuide.xcresult --compact | tee build/test-summary.json || true
            xcrun xcresulttool get test-results tests --path build/ATGuide.xcresult --compact > build/test-list.json || true
          fi
          grep -h "Accessibility audit" build/xcodebuild.log > build/accessibility-audit.txt || true
          cat build/accessibility-audit.txt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATGuide-test-results
          path: |
            build/ATGuide.xcresult
            build/xcodebuild.log
            build/test-summary.json
            build/test-list.json
            build/accessibility-audit.txt
          if-no-files-found: warn
